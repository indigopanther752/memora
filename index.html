<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f0">
    <title>Memora | Your memory companion</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="brand">Memora</h1>
        </div>
    </header>

    <main class="dashboard">
        <section class="welcome-row" aria-labelledby="welcome-title">
            <div class="welcome-copy">
                <h2 id="welcome-title">Welcome Katie!</h2>
                <p>How are you feeling?</p>
            </div>

            <section class="calendar-card" aria-label="Today's reminders">
                <img class="calendar-icon" src="assets/calendar-check.svg" alt="">
                <ul class="reminders">
                    <li>Medication at 10 AM</li>
                    <li>Doctor's appointment at 2 PM</li>
                </ul>
                <button class="action-button calendar-button" type="button">View my calendar <span aria-hidden="true">→</span></button>
            </section>
        </section>

        <section class="activities" aria-labelledby="activities-title">
            <h2 id="activities-title">What would you like to do today?</h2>
            <div class="activity-grid">
                <article class="activity-card activity-card-gold">
                    <img class="activity-art" src="assets/memory-card-texture.png" alt="">
                    <h3>Memory game</h3>
                    <p>Revisit your favorite memories</p>
                    <button class="action-button" type="button">Get Started <span aria-hidden="true">→</span></button>
                </article>
                <article class="activity-card activity-card-green">
                    <img class="activity-art" src="assets/memory-card-texture.png" alt="">
                    <h3>Memory game</h3>
                    <p>Revisit your favorite memories</p>
                    <button class="action-button" type="button">Get Started <span aria-hidden="true">→</span></button>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
