<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memora — Memory Practice</title>
  <link href="https://googleapis.com" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Load Supabase JS -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F7F5F0;
      color: #26302B;
    }
    .navbar {
      height: 96px;
      padding: 0 53px;
      background: #609181;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      color: #F7F5F0;
      font-size: 40px;
      font-family: 'Abhaya Libre', serif;
      font-weight: 800;
    }
    .home-btn {
      text-decoration: none;
      padding: 12px 28px;
      background: #F7F5F0;
      border-radius: 9999px;
      color: #26302B;
      font-size: 18px;
      font-weight: 500;
      box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
    }
    .container {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: #FFFFFF;
      padding: 32px;
      border-radius: 28px;
      box-shadow: 0 4px 16px rgba(38, 48, 43, 0.06);
      margin-bottom: 24px;
    }
    h2 {
      font-family: 'Abhaya Libre', serif;
      font-size: 36px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #26302B;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 6px;
      color: #26302B;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #D5DDD8;
      border-radius: 14px;
      box-sizing: border-box;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      background-color: #44695C;
      color: white;
    }
    button:hover { background-color: #355F50; }
    button.secondary { background-color: #DFC69A; color: #26302B; }
    button.secondary:hover { background-color: #d3b581; }
    button.outline { background-color: white; color: #44695C; border: 2px solid #44695C; }
    .hidden { display: none; }
    .question-item {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #E5E7EB;
    }
    .memory-media {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 14px;
    }
    .hint-text {
      color: #44695C;
      font-style: italic;
      font-size: 15px;
      margin: 8px 0;
    }
    .feedback-msg {
      margin-top: 10px;
      font-weight: 600;
      font-size: 16px;
    }
    .result {
      font-size: 22px;
      font-weight: 700;
      margin-top: 20px;
      color: #355F50;
    }
  </style>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #F7F5F0;
      color: #26302B;
      font-family: 'Inter', sans-serif;
    }
    /* Top Sage Header */
    .navbar {
      height: 88px;
      padding: 0 53px;
      background: #609181;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      color: #F7F5F0;
      font-size: 38px;
      font-family: 'Abhaya Libre', serif;
      font-weight: 800;
    }
    .nav-pill {
      text-decoration: none;
      padding: 10px 26px;
      background: #F7F5F0;
      border-radius: 9999px;
      color: #26302B;
      font-size: 16px;
      font-weight: 500;
      box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
    }

    /* Main Page Container */
    .page-wrapper {
      max-width: 1040px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    /* Hero Header Row */
    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 36px;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6E7A73;
      margin-bottom: 8px;
    }
     h1 {
      font-family: 'Abhaya Libre', serif;
      font-size: 54px;
      font-weight: 800;
      line-height: 1.05;
      margin: 0 0 12px;
      color: #26302B;
    }
    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      color: #4F5B54;
      max-width: 540px;
      margin: 0;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .outline-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #F7F5F0;
      border: 1.5px solid #26302B;
      border-radius: 9999px;
      color: #26302B;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .outline-pill:hover { background: #ECE8DF; }

    /* Game Stage Card */
    .game-card {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 4px 20px rgba(38, 48, 43, 0.05);
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 36px;
      align-items: center;
    }
    @media (max-width: 820px) {
      .game-card { grid-template-columns: 1fr; }
      .navbar { padding: 0 24px; }
    }
    /* Left Side: Photo / Video Frame */
    .media-frame {
      background: #EFECE4;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .media-frame img,
    .media-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .progress-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #C3D6CC;
      color: #26302B;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Right Side: Prompt & Gentle Input */
    .question-title {
      font-family: 'Abhaya Libre', serif;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 18px;
      color: #26302B;
    }
    .guess-input {
      width: 100%;
      height: 56px;
      padding: 0 20px;
      font-size: 18px;
      font-family: 'Inter', sans-serif;
      color: #26302B;
      background: #F7F5F0;
      border: 2px solid #D5DDD8;
      border-radius: 18px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .guess-input:focus {
      border-color: #44695C;
      background: #FFFFFF;
    }
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-primary {
      height: 52px;
      padding: 0 30px;
      background: #44695C;
      color: #FFFFFF;
      border: none;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: #355F50; }
    .btn-dark {
      height: 52px;
      padding: 0 30px;
      background: #26302B;
      color: #FFFFFF;
      border: none;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-dark:hover { background: #18201C; }
    .btn-secondary {
      height: 52px;
      padding: 0 24px;
      background: #FFFFFF;
      color: #355F50;
      border: 2px solid #44695C;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #F0F5F2; }
    /* Hint & Feedback Banners */
    .hint-box {
      margin-top: 16px;
      padding: 14px 18px;
      background: #DFC69A;
      color: #26302B;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
    }
    .feedback-box {
      margin-top: 18px;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.45;
    }
     .feedback-success {
      background: #C3D6CC;
      color: #1F3A30;
    }
    .feedback-gentle {
      background: #F4E6CC;
      color: #493D2D;
    }

    /* Add Question Drawer */
    .builder-card {
      background: #DFC69A;
      border-radius: 32px;
      padding: 36px;
      margin-top: 32px;
    }
    .builder-card h2 {
      font-family: 'Abhaya Libre', serif;
      font-size: 38px;
      margin: 0 0 8px;
      color: #26302B;
    }
    .builder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media (max-width: 700px) {
      .builder-grid { grid-template-columns: 1fr; }
    }
    .builder-field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #26302B;
    }
    .builder-field input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
    }
    .builder-field input[type="file"] {
      padding-top: 11px;
    }
    /* Empty / Completion State */
    .center-state {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 56px 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(38, 48, 43, 0.05);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <div class="navbar">
    <div class="brand">Memora</div>
    <a href="index.html" class="home-btn">← Home</a>
  </div>

  <div class="container">
    <!-- Step 1: Add Memories to Supabase -->
    <div id="builder-section" class="card">
      <h2>Add a Memory Question</h2>
      <p style="color: #5C6B63; margin-top: 0;">Saved memories ready to practice: <strong id="question-count">Loading...</strong></p>

      <label for="media-input">Photo or Video (Optional):</label>
      <input type="file" id="media-input" accept="image/*,video/*" />
      <label for="question-input">Prompt / Question:</label>
      <input type="text" id="question-input" placeholder="e.g., Who is smiling in this photo? or Where was this taken?" />

      <label for="answer-input">Person or Place (Answer):</label>
      <input type="text" id="answer-input" placeholder="e.g., Grandma Rose or Lake Tahoe" />

      <label for="hint-input">Gentle Hint (Optional):</label>
      <input type="text" id="hint-input" placeholder="e.g., We visited here every July" />

      <div class="btn-row">
        <button type="button" id="save-btn" onclick="addQuestion()">+ Save Memory</button>
        <button type="button" class="secondary" onclick="startQuiz()">Start Memory Practice →</button>
      </div>
    </div>
    <!-- Step 2: Practice Memories -->
    <div id="quiz-section" class="card hidden">
      <h2>Memory Practice</h2>
      <p style="color: #5C6B63; margin-top: 0;">Take your time. Type the person or place you remember.</p>

      <div id="quiz-container"></div>

      <div class="btn-row">
        <button type="button" onclick="submitQuiz()">Check My Answers</button>
        <button type="button" class="outline" onclick="showBuilder()">+ Add More Memories</button>
      </div>

      <div id="score-display" class="result"></div>
    </div>
  </div>
  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let quizData = [];

    // Load saved memories from Supabase when page opens
    window.addEventListener('DOMContentLoaded', loadSavedMemories);

    async function loadSavedMemories() {
      const { data, error } = await supabaseClient
        .from('memories')
        .select('*')
        .order('created_at', { ascending: false });
        if (error) {
        console.error('Error fetching memories:', error.message);
        document.getElementById('question-count').textContent = '0 (Log in to sync)';
        return;
      }

      quizData = data || [];
      document.getElementById('question-count').textContent = quizData.length;
    }

    // 2. Upload Photo/Video & Save Question to Supabase
    async function addQuestion() {
      const fileInput = document.getElementById('media-input');
      const qInput = document.getElementById('question-input');
      const aInput = document.getElementById('answer-input');
      const hInput = document.getElementById('hint-input');
      const saveBtn = document.getElementById('save-btn');
      const question = qInput.value.trim();
      const answer = aInput.value.trim();
      const hint = hInput.value.trim();
      const file = fileInput.files[0];

      if (!question || !answer) {
        alert("Please enter both a question and the person/place answer.");
        return;
      }

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        alert("Please sign in on the Home page first so your memories save to your account.");
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      let mediaUrl = null;
      let mediaType = null;

      // If a photo or video was attached, upload to Supabase Storage
      if (file) {
        const filePath = `${user.id}/${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('memory-photos')
          .upload(filePath, file);

        if (uploadError) {
          alert("Upload failed: " + uploadError.message);
          saveBtn.disabled = false;
          saveBtn.textContent = '+ Save Memory';
          return;
        }
        const { data: urlData } = supabaseClient.storage
          .from('memory-photos')
          .getPublicUrl(filePath);

        mediaUrl = urlData.publicUrl;
        mediaType = file.type.startsWith('video/') ? 'video' : 'image';
      }

      // Insert row into Postgres 'memories' table
      const { error: dbError } = await supabaseClient
        .from('memories')
        .insert({
          user_id: user.id,
          question: question,
          answer: answer,
          hint: hint,
          media_url: mediaUrl,
          media_type: mediaType
        });
        saveBtn.disabled = false;
      saveBtn.textContent = '+ Save Memory';

      if (dbError) {
        alert("Database error: " + dbError.message);
        return;
      }

      // Clear inputs and reload list
      fileInput.value = '';
      qInput.value = '';
      aInput.value = '';
      hInput.value = '';
      await loadSavedMemories();
      alert("Memory saved!");
    }
    // 3. Render the Practice Session
    function startQuiz() {
      if (quizData.length === 0) {
        alert("Please save at least one memory first!");
        return;
      }

      document.getElementById('builder-section').classList.add('hidden');
      document.getElementById('quiz-section').classList.remove('hidden');
      document.getElementById('score-display').textContent = '';

      const container = document.getElementById('quiz-container');
      container.innerHTML = '';
      // Shuffle questions gently
      const shuffled = [...quizData].sort(() => Math.random() - 0.5);
      quizData = shuffled;

      quizData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'question-item';

        let mediaHTML = '';
        if (item.media_url) {
          mediaHTML = item.media_type === 'video'
            ? `<video src="${item.media_url}" controls class="memory-media"></video>`
            : `<img src="${item.media_url}" alt="Memory" class="memory-media" />`;
        }

        const hintHTML = item.hint
          ? `<button type="button" class="outline" style="padding: 6px 14px; font-size: 14px; margin-top: 8px;" onclick="document.getElementById('hint-${index}').classList.remove('hidden')">Need a Hint?</button>
             <p id="hint-${index}" class="hint-text hidden">Hint: ${item.hint}</p>`
          : '';
          div.innerHTML =
          mediaHTML +
          '<label for="user-ans-' + index + '">' + (index + 1) + '. ' + item.question + '</label>' +
          '<input type="text" id="user-ans-' + index + '" placeholder="Type the person or place..." />' +
          hintHTML +
          '<div id="feedback-' + index + '" class="feedback-msg"></div>';

        container.appendChild(div);
      });
    }
    // 4. Forgiving Answer Check
    function submitQuiz() {
      let score = 0;

      quizData.forEach((item, index) => {
        const userInput = document.getElementById('user-ans-' + index);
        const feedbackEl = document.getElementById('feedback-' + index);
        const userAnswer = userInput.value.trim().toLowerCase();
        const correctAnswer = item.answer.trim().toLowerCase();

        // Allow exact match OR partial match (e.g., "Rose" matches "Grandma Rose")
        const isMatch = userAnswer && (
          userAnswer === correctAnswer ||
          (userAnswer.length >= 3 && correctAnswer.includes(userAnswer))
        );
        if (isMatch) {
          score++;
          userInput.style.borderColor = '#355F50';
          userInput.style.backgroundColor = '#ECFDF5';
          feedbackEl.style.color = '#355F50';
          feedbackEl.textContent = "Yes! That's " + item.answer + ".";
        } else {
          userInput.style.borderColor = '#D97706';
          userInput.style.backgroundColor = '#FFFBEB';
          feedbackEl.style.color = '#92400E';
          feedbackEl.textContent = "Good try — this is " + item.answer + ".";
        }
      });

      document.getElementById('score-display').textContent =
        "You remembered " + score + " out of " + quizData.length + "!";
    }
    function showBuilder() {
      document.getElementById('quiz-section').classList.add('hidden');
      document.getElementById('builder-section').classList.remove('hidden');
    }
  </script>

</body>
</html>
