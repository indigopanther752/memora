<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memora — Progress</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #F7F5F0; font-family: 'Inter', sans-serif; color: #26302B; }
    .page { max-width: 1268px; margin: 0 auto; }

    .content { padding: 48px 53px 96px; }
    h1 { margin: 0; font-family: 'Abhaya Libre', serif; font-weight: 800; font-size: 60px; line-height: 64px; }
    .subtitle { margin: 8px 0 0; color: #52635A; font-size: 22px; }

    /* Tracker card */
    .card { margin-top: 36px; background: #fff; border: 1px solid #DFE5DE; border-radius: 24px; padding: 32px; box-sizing: border-box; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-family: 'Abhaya Libre', serif; font-weight: 800; font-size: 32px; }
    .card-head p { margin: 4px 0 0; color: #59675F; font-size: 15px; }
    .today-chip { background: #E9EDE7; color: #355F50; font-size: 14px; font-weight: 500; padding: 10px 20px; border-radius: 9999px; }

    .month-row { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .month-nav { display: flex; align-items: center; gap: 10px; }
    .month-nav h3 { margin: 0; font-size: 22px; font-weight: 500; min-width: 190px; }
    .nav-btn { width: 36px; height: 36px; border-radius: 9999px; border: 1px solid #DFE5DE; background: #fff; color: #355F50; font-size: 18px; cursor: pointer; }
    .nav-btn:hover { background: #F2F5EE; }
    .hint { color: #355F50; font-size: 13px; font-weight: 500; }

    /* Calendar grid */
    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 820px; margin-left: auto; margin-right: auto; }
    .weekdays { margin-top: 20px; text-align: center; font-size: 13px; color: #44534B; font-weight: 500; }
    .grid { margin-top: 12px; }
    .cell { aspect-ratio: 1 / 1; border: 1px solid #EDEFEA; background: #FAFAF8; border-radius: 10px; padding: 8px 10px; box-sizing: border-box; position: relative; font-size: 13px; display: flex; flex-direction: column; align-items: flex-start; }
    .cell.outside { color: #98A29B; }
    .cell.today { background: #F2F5EE; border: 1.5px solid #44695C; }
    .cell .face { margin: auto; display: flex; }
    .cell .today-label { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 10px; color: #355F50; font-weight: 500; }

    .legend { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 28px 48px; font-size: 13px; color: #44534B; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .footnote { margin: 16px 0 0; font-size: 13px; color: #59675F; }
    .error { margin-top: 16px; color: #A0443B; font-size: 14px; min-height: 18px; }

    @media (max-width: 700px) {
      .content { padding: 32px 16px 64px; }
      .card { padding: 20px 12px; }
      .cell { padding: 5px 6px; }
      .cell svg { width: 22px; height: 22px; }
      .grid, .weekdays { gap: 4px; }
      h1 { font-size: 44px; }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar (same on every page) -->
  <header class="site-nav">
    <a class="site-brand" href="index.html">Memora</a>
    <div class="site-nav-actions">
      <a class="site-nav-btn" href="index.html">← Home</a>
      <button id="logout-btn" type="button" class="site-nav-btn">Log Out</button>
    </div>
  </header>

  <div class="page">

    <div class="content">
      <h1>Progress</h1>
      <p class="subtitle">Your wellbeing, one day at a time.</p>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Mood tracker</h2>
            <p>Your daily check-ins, all in one place.</p>
          </div>
          <div class="today-chip" id="today-chip"></div>
        </div>

        <div class="month-row">
          <div class="month-nav">
            <button class="nav-btn" id="prev-month" type="button" aria-label="Previous month">‹</button>
            <h3 id="month-title"></h3>
            <button class="nav-btn" id="next-month" type="button" aria-label="Next month">›</button>
          </div>
          <div class="hint" id="hint"></div>
        </div>

        <div class="weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="grid" id="calendar-grid"></div>

        <div class="legend" id="legend"></div>
        <p class="footnote">A new selection replaces today's mood. Days without a check-in stay empty.</p>
        <div class="error" id="calendar-error"></div>
      </section>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://' + 'wmdtjluxbobbpriiuctv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_bO577SIYEYbfl5FRXAfLvA_e2Bvu7wd';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  </script>
  <script src="script.js"></script>
  <script src="mood.js"></script>
  <script src="progress.js"></script>
</body>
</html>
